name: published

# When a recipe's pull request is merged, tell its issue and label it.
on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  published:
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'recipe/issue-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const number = Number(context.payload.pull_request.head.ref.replace('recipe/issue-', ''));
            if (!Number.isInteger(number) || number <= 0) return;
            await github.rest.issues.addLabels({ ...context.repo, issue_number: number, labels: ['published'] });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: number,
              body: '已上架 🎉 订阅了社区源的人刷新「玩法」就能看到它（每周自动刷新，也可以在「订阅源」里手动刷新）。用它画的图欢迎贴在这里，👍 就是投票。\n\nPublished 🎉 Everyone following the community source sees it after a refresh. Post what you make with it here; 👍 is a vote.',
            });
