name: index

# Rebuild index.json after a merge and once a day, so votes (👍 on each recipe's issue)
# and works (pictures in its comments) stay current.
on:
  push:
    branches: [main]
    paths: ['recipes/**', 'covers/**', 'scripts/**']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-index.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          git commit -m 'Rebuild index.json'
          git push
