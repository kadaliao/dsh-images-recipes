name: intake

# Check a recipe submitted through the issue form and open a pull request that adds it.
# The issue's text is only ever read from the event file by scripts/intake.mjs, never
# put into a shell command.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'recipe') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - run: node scripts/intake.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
